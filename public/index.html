    async function runAdvisorTask(agentId, taskId) {
      showLoading('Running task...');
      try {
        const result = await API.runTask(agentId, taskId, {}, []);
        showTaskResult(`Task Result`, result.output || result.result || JSON.stringify(result));
      } catch (err) {
        alert('Task failed: ' + err.message);
      } finally {
        hideLoading();
      }
    }

    async function uploadAdvisorFile(agentId, input) {
      const file = input.files[0];
      if (!file) return;
      showLoading('Uploading...');
      try {
        const text = await file.text();
        await API.uploadFile(file.name, text, agentId);
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        hideLoading();
      }
    }

    async function addAdvisorTextFile(agentId) {
      const name = prompt('File name:');
      if (!name) return;
      const content = prompt('File content:');
      if (!content) return;
      try {
        await API.uploadFile(name, content, agentId);
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Failed: ' + err.message);
      }
    }

    async function deleteAdvisorFile(fileId, agentId) {
      if (!confirm('Delete this file?')) return;
      try {
        await API.deleteFile(fileId);
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    async function addAdvisorMemory(agentId) {
      const input = document.getElementById(`personalMemInput-${agentId}`);
      const content = input.value.trim();
      if (!content) return;
      try {
        await API.addPersonalMemory(agentId, content);
        input.value = '';
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Failed to add memory: ' + err.message);
      }
    }

    async function deleteAdvisorMemory(agentId, id) {
      if (!confirm('Delete this memory?')) return;
      try {
        await API.deletePersonalMemory(agentId, id);
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    async function addSharedMemoryEntry(agentId) {
      const input = document.getElementById(`sharedMemInput-${agentId}`);
      const content = input.value.trim();
      if (!content) return;
      try {
        await API.addSharedMemory(content);
        sharedMemory = await API.getSharedMemory();
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Failed: ' + err.message);
      }
    }

    async function deleteSharedMemoryEntry(id) {
      if (!confirm('Delete this shared memory?')) return;
      try {
        await API.deleteSharedMemory(id);
        sharedMemory = await API.getSharedMemory();
        renderAdvisorDetail(currentDetailAdvisor);
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    // --- Simulations View ---
    let simSelectedAgents = new Set();
    let simSynthesizer = null;
    let simResults = null;

    function renderSimulationsView() {
      const advisorCheckboxes = advisors.map(a => `
        <label class="sim-agent-checkbox" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition)">
          <input type="checkbox" value="${a.id}" onchange="toggleSimAgent('${a.id}', this.checked)" ${simSelectedAgents.has(a.id) ? 'checked' : ''}>
          <span style="font-size:18px">${a.icon}</span>
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">${escapeHtml(a.name)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${escapeHtml(a.shortTitle)}</div>
          </div>
        </label>
      `).join('');

      const synthOptions = advisors.map(a =>
        `<option value="${a.id}" ${simSynthesizer === a.id ? 'selected' : ''}>${escapeHtml(a.name)} (${escapeHtml(a.shortTitle)})</option>`
      ).join('');

      const resultsHtml = simResults ? renderSimulationResults(simResults) : '';

      const content = `
        <div class="simulations-view">
          <div class="dashboard-header">
            <h2>Business Outcome Simulations</h2>
            <p>Test business scenarios and simulate outcomes across your executive team. Each advisor analyzes from their functional lens, then a synthesizer produces a unified outcome projection.</p>
          </div>

          <div class="card" style="margin-bottom:24px">
            <h3>Scenario</h3>
            <textarea id="simScenario" rows="5" placeholder="Describe the business scenario to simulate. Example: 'We cut headcount by 20% across all departments to extend runway from 8 to 14 months.' Include key parameters, constraints, and what you want to understand." style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--text);font-size:14px;line-height:1.5;resize:vertical"></textarea>
          </div>

          <div class="card" style="margin-bottom:24px">
            <h3>Select Advisors</h3>
            <p class="text-muted" style="font-size:13px;margin-bottom:12px">Choose which advisors analyze the scenario. More advisors = richer analysis but longer runtime.</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
              ${advisorCheckboxes}
            </div>
          </div>

          <div class="card" style="margin-bottom:24px">
            <h3>Synthesizer</h3>
            <p class="text-muted" style="font-size:13px;margin-bottom:8px">Who synthesizes the team's analyses into a final outcome projection?</p>
            <select id="simSynthesizer" onchange="simSynthesizer=this.value" style="width:100%;max-width:400px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;color:var(--text);font-size:14px">
              <option value="">Default (first selected advisor)</option>
              ${synthOptions}
            </select>
          </div>

          <button class="btn btn-primary" id="runSimBtn" onclick="runSimulation()" style="padding:12px 28px;font-size:15px;margin-bottom:24px">
            ▶ Run Simulation
          </button>

          <div id="simResults">
            ${resultsHtml}
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    function toggleSimAgent(id, checked) {
      if (checked) simSelectedAgents.add(id);
      else simSelectedAgents.delete(id);
    }

    async function runSimulation() {
      const scenario = document.getElementById('simScenario')?.value.trim();
      const agentIds = Array.from(simSelectedAgents);
      const synthesizerId = document.getElementById('simSynthesizer')?.value || null;

      if (!scenario) { alert('Please describe a scenario to simulate.'); return; }
      if (agentIds.length === 0) { alert('Please select at least one advisor.'); return; }

      simSynthesizer = synthesizerId;
      const btn = document.getElementById('runSimBtn');
      btn.disabled = true;
      btn.textContent = 'Running simulation...';
      document.getElementById('simResults').innerHTML = `
        <div class="card" style="text-align:center;padding:40px">
          <div style="font-size:14px;color:var(--text-muted)">Analyzing scenario across ${agentIds.length} advisor${agentIds.length > 1 ? 's' : ''}...</div>
        </div>
      `;

      try {
        const result = await API.runSimulation(scenario, agentIds, synthesizerId);
        simResults = result;
        document.getElementById('simResults').innerHTML = renderSimulationResults(result);
      } catch (err) {
        document.getElementById('simResults').innerHTML = `<div class="card" style="color:var(--danger,#ef4444);padding:16px">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '▶ Run Simulation';
      }
    }

    function renderSimulationResults(result) {
      const analysesHtml = (result.analyses || []).map(a => `
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:22px">${a.agentIcon || '🎯'}</span>
            <div>
              <div style="font-weight:700;font-size:15px">${escapeHtml(a.agentName)}</div>
              <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(a.agentTitle)}</div>
            </div>
          </div>
          <div class="sim-analysis-body">${renderMarkdown(a.analysis)}</div>
        </div>
      `).join('');

      const synthHtml = result.synthesis ? `
        <div class="card" style="margin-bottom:16px;border:2px solid var(--accent);border-radius:var(--radius)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:22px">🏛️</span>
            <div>
              <div style="font-weight:700;font-size:15px">Synthesis — ${escapeHtml(result.synthesis.agentName)}</div>
              <div style="font-size:12px;color:var(--text-muted)">Unified Outcome Projection</div>
            </div>
          </div>
          <div class="sim-analysis-body">${renderMarkdown(result.synthesis.analysis)}</div>
        </div>
      ` : '';

      return `
        <div class="dashboard-header" style="margin-bottom:20px">
          <h2>Simulation Results</h2>
          <p style="color:var(--text-muted);font-size:13px">Scenario: ${escapeHtml(result.scenario)}</p>
        </div>
        ${synthHtml}
        <h3 style="font-size:16px;font-weight:700;margin:24px 0 12px">Individual Advisor Analyses</h3>
        ${analysesHtml}
      `;
    }

    // --- Memory View ---
    async function renderMemoryView() {
      let stats;
      try { stats = await API.getMemoryStats(); } catch { stats = { sharedCount: 0, personalCount: 0, total: 0, advisorsWithMemory: 0 }; }
      const sharedHtml = sharedMemory.length === 0
        ? '<p class="text-muted" style="padding:12px 0">No shared memory yet.</p>'
        : sharedMemory.map(m => `
          <div class="memory-entry">
            <span class="mem-icon">🌐</span>
            <div class="mem-content">${escapeHtml(m.content)}<div class="mem-meta">Added ${new Date(m.createdAt).toLocaleDateString()} by ${m.createdBy || 'user'}</div></div>
            <button class="mem-delete" onclick="deleteSharedMemoryEntry(${m.id})">Delete</button>
          </div>
        `).join('');

      const content = `
        <div class="settings-view" style="max-width:800px">
          <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">🧠 Memory System</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${stats.total}</div>
              <div class="stat-label">Total Memories</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.sharedCount}</div>
              <div class="stat-label">Shared</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.personalCount}</div>
              <div class="stat-label">Personal</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.advisorsWithMemory}</div>
              <div class="stat-label">Advisors w/ Memory</div>
            </div>
          </div>
          <div class="memory-section">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:8px">🌐 Shared Memory</h3>
            <p class="text-muted" style="font-size:13px;margin-bottom:12px">Shared organizational context injected into all advisors' prompts.</p>
            ${sharedHtml}
            <div class="memory-add">
              <input type="text" id="globalSharedMemInput" placeholder="Add shared memory...">
              <button onclick="addGlobalSharedMemory()">Add</button>
            </div>
          </div>
          <div class="memory-section">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:8px">📋 Per-Advisor Memory</h3>
            <p class="text-muted" style="font-size:13px;margin-bottom:12px">View and manage individual advisor memory. Click an advisor to jump to their detail page.</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
              ${advisors.map(a => `
                <div class="advisor-card" style="border:1px solid var(--border);cursor:pointer" onclick="showAdvisorDetail('${a.id}');setTimeout(()=>switchAdvisorTab('memory'),100)">
                  <div class="advisor-avatar" style="background:${a.color}22">${a.icon}</div>
                  <div class="advisor-info">
    <div class="name">${a.name}</div>
                    <div class="title">${a.shortTitle}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    async function addGlobalSharedMemory() {
      const input = document.getElementById('globalSharedMemInput');
      const content = input.value.trim();
      if (!content) return;
      try {
        await API.addSharedMemory(content);
        sharedMemory = await API.getSharedMemory();
        renderMemoryView();
      } catch (err) {
        alert('Failed: ' + err.message);
      }
    }

    // --- Settings View ---
    async function renderSettingsView() {
      let s;
      try { s = await API.getSettings(); } catch { s = { apiKey: '', apiBase: 'https://api.openai.com/v1', model: 'gpt-4o', hasKey: false, maskedKey: '' }; }
      const statusHtml = s.hasKey
        ? `<div class="settings-status connected">✅ LLM Connected — API key set (currently using <strong>${escapeHtml(s.model)}</strong>)</div>`
        : `<div class="settings-status demo">⚠️ Demo Mode — No API key configured. Set your key to enable live LLM responses.</div>`;

      const content = `
        <div class="settings-view">
          <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">⚙️ Settings</h2>
          ${statusHtml}
          <div class="settings-panel">
            <h3>🔧 LLM Configuration</h3>
            <div class="settings-form-group">
              <label for="settingsApiKey">API Key</label>
              <input type="password" id="settingsApiKey" placeholder="${s.maskedKey ? 'Current: ' + s.maskedKey : 'sk-...'}" autocomplete="new-password">
              <div class="hint">OpenAI-compatible API key. Leave blank to keep current key.</div>
            </div>
            <div class="settings-form-group">
      <label for="settingsApiBase">API Base URL</label>
              <input type="text" id="settingsApiBase" value="${escapeHtml(s.apiBase)}" placeholder="https://api.openai.com/v1">
              <div class="hint">Any OpenAI-compatible endpoint (e.g. OpenAI, OpenRouter, LM Studio, etc.)</div>
            </div>
            <div class="settings-form-group">
              <label for="settingsModel">Model</label>
              <input type="text" id="settingsModel" value="${escapeHtml(s.model)}" placeholder="gpt-4o">
              <div class="hint">Model name (e.g. gpt-4o, gpt-4o-mini, llama-3.1-70b, etc.)</div>
            </div>
            <button class="settings-save-btn" id="settingsSaveBtn" onclick="saveSettings()">Save Settings</button>
            <span id="settingsSavedMsg" style="margin-left:12px;font-size:13px;color:var(--success)"></span>
          </div>
          <div class="settings-panel">
            <h3>🌐 Web Search</h3>
            <p class="text-muted" style="font-size:13px;line-height:1.6;margin-bottom:12px">
              Advisors can search the web for real-time information when responding. Enable the <strong>🌐 Web</strong> toggle in any chat to include web results as context.
            </p>
            <div class="settings-form-group">
              <div class="hint" style="font-size:13px">
                <strong>How it works:</strong> When enabled, the advisor searches the web for your query, injects the top results as context, and uses them to inform its response. Sources are cited at the bottom of the reply.
              </div>
            </div>
            <div class="settings-form-group">
              <div class="hint" style="font-size:13px;color:var(--text-muted)">
                Uses DuckDuckGo by default (no configuration needed). For higher-quality results, set <code>TAVILY_API_KEY</code> in the server environment.
              </div>
            </div>
          </div>
          <div class="settings-panel">
            <h3>📄 Legal Documents</h3>
            <p class="text-muted" style="font-size:13px;line-height:1.6;margin-bottom:12px">
              View the Terms of Service and Privacy Policy for BetterAI360.
            </p>
            <button class="settings-save-btn" style="display:inline-block;width:auto;padding:8px 16px;margin-right:8px" onclick="showLegalDoc('tos')">Terms of Service</button>
            <button class="settings-save-btn" style="display:inline-block;width:auto;padding:8px 16px" onclick="showLegalDoc('privacy')">Privacy Policy</button>
          </div>
          <div class="settings-panel">
            <h3>ℹ️ About</h3>
            <p class="text-muted" style="font-size:13px;line-height:1.6">
              BetterAI360 — C-Suite AI Advisors lets you interact with AI personas representing key C-level executives.
              Configure your LLM API key here to enable live responses, or use demo mode to explore the UI.
              Memory and knowledge files are injected into advisor prompts automatically.
            </p>
          </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    async function saveSettings() {
      const btn = document.getElementById('settingsSaveBtn');
      const msg = document.getElementById('settingsSavedMsg');
      const apiKey = document.getElementById('settingsApiKey').value;
      const apiBase = document.getElementById('settingsApiBase').value;
      const model = document.getElementById('settingsModel').value;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        // Send undefined if apiKey input is blank (keep current key)
        const payload = { apiBase, model };
        if (apiKey.trim()) payload.apiKey = apiKey.trim();
        await apiFetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        msg.textContent = '✓ Saved';
        checkMode();
        setTimeout(() => renderSettingsView(), 1000);
      } catch (err) {
        msg.textContent = '✗ Failed: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Settings';
      }
    }

    // --- Helpers ---
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    async function viewFile(id) {
      try {
        const file = await apiFetch(`/api/data/${id}`).then(r => r.json());
        showTaskResult(file.name, file.content);
      } catch (err) {
        alert('Failed to load file: ' + err.message);
      }
    }

  </script>
</body>
</html>
