<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-Suite AI Advisors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #14141d;
      --bg-elevated: #1c1c28;
      --bg-hover: #242434;
      --border: #2a2a3a;
      --border-light: #3a3a4a;
      --text: #e4e4ed;
      --text-muted: #8b8b9e;
      --text-dim: #5a5a6e;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-dim: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Layout --- */
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      width: 320px;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-dim);
      color: var(--accent-hover);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .mode-badge.live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .mode-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .nav-section {
      padding: 16px 12px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding: 0 8px 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--accent-dim);
      color: var(--accent-hover);
    }

    .nav-btn .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .advisor-list {
      flex: 1;
      overflow-y: auto;
    }

    .advisor-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .advisor-card:hover {
      background: var(--bg-hover);
    }

    .advisor-card.active {
      background: var(--bg-elevated);
      border-color: var(--border-light);
    }

    .advisor-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .advisor-info {
      flex: 1;
      min-width: 0;
    }

    .advisor-info .name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .advisor-info .title {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* --- Main Content --- */
    .main {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Dashboard View --- */
    .dashboard {
      overflow-y: auto;
      padding: 32px 40px;
    }

    .dashboard-header {
      margin-bottom: 32px;
    }

    .dashboard-header h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .dashboard-header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .stat-card .stat-value {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .advisor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .advisor-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .advisor-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--advisor-color, var(--accent));
      opacity: 0;
      transition: var(--transition);
    }

    .advisor-tile:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .advisor-tile:hover::before {
      opacity: 1;
    }

    .advisor-tile .tile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .advisor-tile .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: var(--bg-elevated);
    }

    .advisor-tile .tile-name {
      font-size: 16px;
      font-weight: 700;
    }

    .advisor-tile .tile-title {
      font-size: 12px;
      color: var(--text-muted);
    }

    .advisor-tile .tile-tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .advisor-tile .tile-expertise {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .expertise-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* --- Chat View --- */
    .chat-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .chat-header .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .chat-header .info h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .chat-header .info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-header .actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .chat-header .action-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-header .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-light);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .message-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.7;
    }

    .message.user .message-content {
      background: var(--accent-dim);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      margin: 12px 0 8px;
      font-weight: 700;
    }

    .message-content h1 { font-size: 18px; }
    .message-content h2 { font-size: 16px; }
    .message-content h3 { font-size: 14px; }

    .message-content ul,
    .message-content ol {
      margin: 8px 0;
      padding-left: 24px;
    }

    .message-content li {
      margin: 4px 0;
    }

    .message-content table {
      border-collapse: collapse;
      margin: 12px 0;
      width: 100%;
    }

    .message-content th,
    .message-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    .message-content th {
      background: var(--bg-elevated);
      font-weight: 600;
    }

    .message-content code {
      background: var(--bg-elevated);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .message-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .message-content strong {
      font-weight: 600;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 800px;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      transition: var(--transition);
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* --- Task View --- */
    .task-view {
      overflow-y: auto;
      padding: 32px 40px;
    }

    .task-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .task-header .back-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: var(--transition);
    }

    .task-header .back-btn:hover {
      background: var(--bg-hover);
    }

    .task-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .task-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .task-grid { grid-template-columns: 1fr; }
    }

    .task-list-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .task-list-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-item {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .task-item:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
    }

    .task-item.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .task-item .task-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task-item .task-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .task-item .task-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .task-item .input-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-elevated);
      color: var(--text-dim);
    }

    .task-form-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .task-form-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .run-btn {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .run-btn:hover {
      background: var(--accent-hover);
    }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* --- Task Result Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 800px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--bg-hover);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
    }

    .modal-body h1,
    .modal-body h2,
    .modal-body h3 {
      margin: 16px 0 8px;
      font-weight: 700;
    }

    .modal-body h1 { font-size: 20px; }
    .modal-body h2 { font-size: 17px; }
    .modal-body h3 { font-size: 15px; }

    .modal-body ul,
    .modal-body ol { padding-left: 24px; margin: 8px 0; }
    .modal-body li { margin: 4px 0; }

    .modal-body table {
      border-collapse: collapse;
      margin: 12px 0;
      width: 100%;
    }

    .modal-body th,
    .modal-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    .modal-body th {
      background: var(--bg-elevated);
      font-weight: 600;
    }

    .modal-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-muted);
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
    }

    .modal-btn:hover { background: var(--bg-hover); }

    .modal-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .modal-btn.primary:hover { background: var(--accent-hover); }

    /* --- Loading --- */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(4px);
      z-index: 150;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* --- Empty State --- */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }

    /* --- Mobile --- */
    .mobile-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        grid-column: 1;
      }
      .mobile-toggle {
        display: flex;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 101;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .dashboard, .task-view, .kb-view, .workflow-view, .report-view { padding: 60px 16px 16px; }
    }

    /* --- Knowledge Base --- */
    .kb-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 20px;
    }
    .kb-upload-area:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .kb-upload-area.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .kb-upload-area .upload-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .kb-file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kb-file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .kb-file-item:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
    }
    .kb-file-icon { font-size: 20px; flex-shrink: 0; }
    .kb-file-info { flex: 1; min-width: 0; }
    .kb-file-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kb-file-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .kb-file-actions { display: flex; gap: 6px; flex-shrink: 0; }
 }
    .kb-file-actions button {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
    }
    .kb-file-actions button:hover { background: var(--bg-hover); }
    .kb-file-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* --- Workflows --- */
    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .workflow-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .workflow-card:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .workflow-card.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .workflow-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .workflow-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .workflow-card-name { font-size: 16px; font-weight: 700; }
    .workflow-card-steps { font-size: 12px; color: var(--text-muted); }
    .workflow-card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .workflow-flow {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 16px 0;
    }
    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      padding-bottom: 20px;
    }
    .flow-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 19px;
      top: 40px;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .flow-step-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      z-index: 1;
    }
    .flow-step-icon.done {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
    }
    .flow-step-icon.active {
      border-color: var(--accent);
      animation: pulse 1.5s infinite;
    }
    .flow-step-content { flex: 1; padding-top: 4px; }
    .flow-step-title {
      font-size: 13px;
      font-weight: 600;
    }
    .flow-step-title .agent-tag {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 6px;
    }
    .flow-step-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .flow-step-result {
      margin-top: 8px;
      padding: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
    }
    .workflow-run-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
    }

    /* --- Reports --- */
    .report-section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .report-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .report-section-header .agent-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .report-section-header .name { font-size: 14px; font-weight: 600; }
    .report-section-header .title { font-size: 12px; color: var(--text-muted); }
    .report-section-header .remove-btn {
      margin-left: auto;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
    }
    .report-section-header .remove-btn:hover { border-color: var(--danger); color: var(--danger); }
    .report-add-section {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }
    .report-add-section select,
    .report-add-section input {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .report-add-section select { flex-shrink: 0; }
    .report-add-section input { flex: 1; }
    .report-add-section button {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: var(--transition);
    }
    .report-add-section button:hover { background: var(--accent-hover); }

    /* --- Context file picker in chat --- */
    .context-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      font-size: 12px;
    }
    .context-bar label {
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .context-bar select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
    }
    .context-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent-hover);
      font-size: 11px;
      font-weight: 600;
    }
    .context-chip .remove {
      cursor: pointer;
      opacity: 0.6;
    }
    .context-chip .remove:hover { opacity: 1; }
  </style>
</head>
<body>
  <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🏢</div>
          <div class="logo-text">
            <h1>C-Suite Advisors</h1>
            <p>Your AI Executive Team</p>
          </div>
        </div>
        <div class="mode-badge" id="modeBadge">
          <span class="dot"></span>
          <span id="modeText">Checking...</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Menu</div>
        <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">
          <span class="icon">📊</span> Dashboard
        </button>
        <button class="nav-btn" data-view="tasks" onclick="showView('tasks')">
          <span class="icon">📋</span> Tasks
        </button>
        <button class="nav-btn" data-view="workflows" onclick="showView('workflows')">
          <span class="icon">🔄</span> Workflows
        </button>
        <button class="nav-btn" data-view="reports" onclick="showView('reports')">
          <span class="icon">📑</span> Reports
        </button>
        <button class="nav-btn" data-view="knowledge" onclick="showView('knowledge')">
          <span class="icon">📚</span> Knowledge Base
        </button>
      </div>

      <div class="nav-section advisor-list">
        <div class="nav-label">Advisors</div>
        <div id="advisorList"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="mainContent"></main>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Working on it...</div>
  </div>

  <!-- Task Result Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Task Result</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="copyResult()">Copy</button>
        <button class="modal-btn primary" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>

  <script>
    // --- State ---
    let advisors = [];
    let allTasks = [];
    let workflows = [];
    let knowledgeFiles = [];
    let currentView = 'dashboard';
    let currentAdvisor = null;
    let chatHistory = {};
    let selectedTask = null;
    let chatContextFiles = [];
    let reportSections = [];
    let workflowRunning = false;

    // --- API ---
    const API = {
      getAgents: () => fetch('/api/agents').then(r => r.json()),
      getTasks: () => fetch('/api/tasks').then(r => r.json()),
      getWorkflows: () => fetch('/api/workflows').then(r => r.json()),
      getKnowledge: () => fetch('/api/data').then(r => r.json()),
      chat: (agentId, message, history, contextFileIds) =>
        fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, message, history, contextFileIds }),
        }).then(r => r.json()),
      runTask: (agentId, taskId, inputs, contextFileIds) =>
        fetch('/api/tasks/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, taskId, inputs, contextFileIds }),
        }).then(r => r.json()),
      uploadFile: (name, content) =>
        fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, content }),
        }).then(r => r.json()),
      uploadFileForm: (formData) =>
        fetch('/api/data', { method: 'POST', body: formData }).then(r => r.json()),
      deleteFile: (id) =>
        fetch(`/api/data/${id}`, { method: 'DELETE' }).then(r => r.json()),
      runWorkflow: (id, input) =>
        fetch(`/api/workflows/${id}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input }),
        }).then(r => r.json()),
      generateReport: (title, subject, sections, synthesizerId) =>
        fetch('/api/reports/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, subject, sections, synthesizerId }),
        }).then(r => r.json()),
      discuss: (topic, agentIds) =>
        fetch('/api/agents/discuss', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, agentIds }),
        }).then(r => r.json()),
      message: (fromId, toId, type, message, context) =>
        fetch('/api/agents/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fromId, toId, type, message, context }),
        }).then(r => r.json()),
    };

    // --- Init ---
    async function init() {
      try {
        const [agentsRes, tasksRes, wfRes, kbRes] = await Promise.all([
          API.getAgents(), API.getTasks(), API.getWorkflows(), API.getKnowledge()
        ]);
        advisors = agentsRes;
        allTasks = tasksRes;
        workflows = wfRes;
        knowledgeFiles = kbRes;
        renderDashboard();
        checkMode();
      } catch (err) {
        document.getElementById('mainContent').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><h3>Connection Error</h3><p>Could not connect to the server. Make sure it is running.</p></div>';
      }
    }

    async function checkMode() {
      try {
        const res = await fetch('/api/health').then(r => r.json());
        const badge = document.getElementById('modeBadge');
        const text = document.getElementById('modeText');
        if (res.llmConfigured) {
          badge.classList.add('live');
          text.textContent = 'LLM Connected';
        } else {
          text.textContent = 'Demo Mode';
        }
      } catch {
        document.getElementById('modeText').textContent = 'Demo Mode';
      }
    }

    // --- Markdown Renderer ---
    function renderMarkdown(text) {
      if (!text) return '';
      let html = text;
      // Tables
      html = html.replace(/^\|(.+)\|\n\|([-:\s|]+)\|\n((?:\|.+\|\n?)+)/gm, (match, header, sep, body) => {
        const headers = header.split('|').map(h => h.trim()).filter(h => h);
        const rows = body.trim().split('\n').map(row =>
          row.split('|').map(c => c.trim()).filter((c, i, arr) => i < arr.length)
        );
        let table = '<table><thead><tr>';
        headers.forEach(h => { table += `<th>${h}</th>`; });
        table += '</tr></thead><tbody>';
        rows.forEach(row => {
          table += '<tr>';
          row.forEach(cell => { table += `<td>${cell}</td>`; });
          table += '</tr>';
        });
        table += '</tbody></table>';
        return table;
      });
      // Headings
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      // Bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // Italic
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // Code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Blockquote
      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      // Lists
      html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
      html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
      // Paragraphs
      html = html.split('\n\n').map(block => {
        if (block.startsWith('<') ) return block;
        return `<p>${block.replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
      return html;
    }

    // --- Views ---
    function showView(view, advisorId = null) {
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      if (advisorId) {
        currentAdvisor = advisors.find(a => a.id === advisorId);
        renderChat(currentAdvisor);
      } else if (view === 'dashboard') {
        renderDashboard();
      } else if (view === 'tasks') {
        renderTaskView();
      } else if (view === 'workflows') {
        renderWorkflowView();
      } else if (view === 'reports') {
        renderReportView();
      } else if (view === 'knowledge') {
        renderKnowledgeView();
      }
      // Close mobile sidebar
      document.getElementById('sidebar').classList.remove('open');
    }

    // --- Dashboard ---
    function renderDashboard() {
      const totalTasks = advisors.reduce((sum, a) => sum + a.taskCount, 0);
      const capabilities = advisors.reduce((sum, a) => sum + a.capabilities.length, 0);
      const content = `
        <div class="dashboard">
          <div class="dashboard-header">
            <h2>Your AI Executive Team</h2>
            <p>Ten C-level advisors ready to chat and run tasks for your business.</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${advisors.length}</div>
              <div class="stat-label">AI Advisors</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${totalTasks}</div>
              <div class="stat-label">Pre-built Tasks</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${workflows.length}</div>
              <div class="stat-label">Workflows</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${knowledgeFiles.length}</div>
              <div class="stat-label">Knowledge Files</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${capabilities}</div>
              <div class="stat-label">Capabilities</div>
            </div>
          </div>
          <div class="advisor-grid">
            ${advisors.map(a => `
              <div class="advisor-tile" style="--advisor-color: ${a.color}" onclick="showView('chat','${a.id}')">
                <div class="tile-header">
                  <div class="tile-icon" style="background: ${a.color}22">${a.icon}</div>
                  <div>
                    <div class="tile-name">${a.name}</div>
                    <div class="tile-title">${a.title}</div>
                  </div>
                </div>
                <div class="tile-tagline">${a.tagline}</div>
                <div class="tile-expertise">
                  ${a.expertise.slice(0, 3).map(e => `<span class="expertise-tag">${e}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    // --- Advisor List (Sidebar) ---
    function renderAdvisorList() {
      const html = advisors.map(a => `
        <div class="advisor-card" data-id="${a.id}" onclick="showView('chat','${a.id}')">
          <div class="advisor-avatar" style="background: ${a.color}22">${a.icon}</div>
          <div class="advisor-info">
            <div class="name">${a.name}</div>
            <div class="title">${a.shortTitle}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('advisorList').innerHTML = html;
    }

    // --- Chat ---
    function renderChat(advisor) {
      if (!advisor) return;
      const history = chatHistory[advisor.id] || [];
      const content = `
        <div class="chat-view">
          <div class="chat-header">
            <div class="avatar" style="background: ${advisor.color}22">${advisor.icon}</div>
            <div class="info">
              <h3>${advisor.name}</h3>
              <p>${advisor.title} • ${advisor.tagline}</p>
            </div>
            <div class="actions">
              <button class="action-btn" onclick="showView('tasks')">📋 Tasks</button>
              <button class="action-btn" onclick="clearChat('${advisor.id}')">🗑️ Clear</button>
            </div>
          </div>
          <div class="messages" id="messages">
            ${history.length === 0 ? `
              <div class="empty-state">
                <div class="icon">${advisor.icon}</div>
                <h3>Chat with ${advisor.name}</h3>
                <p>${advisor.tagline}. Ask about ${advisor.expertise.slice(0, 3).join(', ').toLowerCase()}, or any challenge in their domain.</p>
              </div>
            ` : history.map(msg => renderMessage(msg, advisor)).join('')}
          </div>
          <div class="chat-input-area">
            ${knowledgeFiles.length > 0 ? `
              <div class="context-bar">
                <label>📎 Context:</label>
                <select id="contextFileSelect" onchange="toggleContextFile(this.value)">
                  <option value="">No reference file</option>
                  ${knowledgeFiles.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                </select>
                <div id="contextChips" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
              </div>
            ` : ''}
            <div class="chat-input-wrapper">
              <textarea class="chat-input" id="chatInput" placeholder="Ask ${advisor.name} anything..." rows="1"
                onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
              <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
      scrollMessages();
    }

    function renderMessage(msg, advisor) {
      const isUser = msg.role === 'user';
      const avatar = isUser ? '👤' : advisor.icon;
      const avatarBg = isUser ? '' : `style="background: ${advisor.color}22"`;
      return `
        <div class="message ${msg.role}">
          <div class="message-avatar" ${avatarBg}>${avatar}</div>
          <div class="message-content">${isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content)}</div>
        </div>
      `;
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message || !currentAdvisor) return;

      // Store message
      if (!chatHistory[currentAdvisor.id]) chatHistory[currentAdvisor.id] = [];
      chatHistory[currentAdvisor.id].push({ role: 'user', content: message });
      const history = [...chatHistory[currentAdvisor.id]];

      // Render user message
      input.value = '';
      input.style.height = 'auto';
      appendMessage({ role: 'user', content: message }, currentAdvisor);

      // Show typing
      const messages = document.getElementById('messages');
      const typing = document.createElement('div');
      typing.className = 'message';
      typing.id = 'typingIndicator';
      typing.innerHTML = `
        <div class="message-avatar" style="background: ${currentAdvisor.color}22">${currentAdvisor.icon}</div>
        <div class="message-content">
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      `;
      messages.appendChild(typing);
      scrollMessages();

      try {
        const res = await API.chat(currentAdvisor.id, message, history.slice(0, -1), chatContextFiles);
        document.getElementById('typingIndicator')?.remove();
        if (res.error) throw new Error(res.error);
        chatHistory[currentAdvisor.id].push({ role: 'assistant', content: res.response });
        appendMessage({ role: 'assistant', content: res.response }, currentAdvisor);
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        appendMessage({ role: 'assistant', content: `⚠️ Error: ${err.message}` }, currentAdvisor);
      }
    }

    function appendMessage(msg, advisor) {
      const messages = document.getElementById('messages');
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMessage(msg, advisor);
      messages.appendChild(wrapper.firstElementChild);
      scrollMessages();
    }

    function clearChat(advisorId) {
      chatHistory[advisorId] = [];
      if (currentAdvisor && currentAdvisor.id === advisorId) renderChat(currentAdvisor);
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function scrollMessages() {
      const messages = document.getElementById('messages');
      if (messages) messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Task View ---
    function renderTaskView() {
      const content = `
        <div class="task-view">
          <div class="task-header">
            <button class="back-btn" onclick="showView('dashboard')">← Back</button>
            <h2>Run a Task</h2>
          </div>
          <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 14px;">
            Select an advisor and a task, fill in the inputs, and get a structured deliverable.
          </p>
          <div class="task-grid">
            <div class="task-list-panel">
              <h3>📋 Available Tasks</h3>
              <div id="taskList"></div>
            </div>
            <div class="task-form-panel">
              <h3>📝 Task Inputs</h3>
              <div id="taskForm">
                <p style="color: var(--text-muted); font-size: 13px;">Select a task from the left to begin.</p>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
      renderTaskList();
    }

    function renderTaskList() {
      const html = allTasks.map(group => `
        <div style="margin-bottom: 16px;">
          <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px; color: ${group.color};">
            ${group.icon} ${group.agentName} — ${group.agentTitle}
          </div>
          ${group.tasks.map(t => `
            <div class="task-item" data-task-id="${t.id}" data-agent-id="${group.agentId}" onclick="selectTask('${group.agentId}','${t.id}')">
              <div class="task-name">${t.name}</div>
              <div class="task-desc">${t.description}</div>
              <div class="task-inputs">
                ${t.inputs.map(i => `<span class="input-tag">${i}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
      document.getElementById('taskList').innerHTML = html;
    }

    function selectTask(agentId, taskId) {
      document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-task-id="${taskId}"]`).classList.add('selected');

      const agent = advisors.find(a => a.id === agentId);
      const taskGroup = allTasks.find(g => g.agentId === agentId);
      const task = taskGroup.tasks.find(t => t.id === taskId);
      selectedTask = { agentId, taskId, task, agent };

      const formHtml = `
        <div style="margin-bottom: 16px; padding: 12px; border-radius: 8px; background: ${agent.color}11; border: 1px solid ${agent.color}33;">
          <div style="font-size: 13px; font-weight: 700;">${agent.icon} ${agent.name}</div>
          <div style="font-size: 12px; color: var(--text-muted);">${task.name}</div>
        </div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">${task.description}</p>
        ${task.inputs.map(input => `
          <div class="form-group">
            <label>${input}</label>
            <textarea data-input="${input}" placeholder="Enter ${input.toLowerCase()}..."></textarea>
          </div>
        `).join('')}
        <button class="run-btn" onclick="executeTask()">
          ▶ Run Task
        </button>
      `;
      document.getElementById('taskForm').innerHTML = formHtml;
    }

    async function executeTask() {
      if (!selectedTask) return;
      const inputs = {};
      document.querySelectorAll('[data-input]').forEach(el => {
        inputs[el.dataset.input] = el.value;
      });

      showLoading(`${selectedTask.agent.name} is working on "${selectedTask.task.name}"...`);

      try {
        const res = await API.runTask(selectedTask.agentId, selectedTask.taskId, inputs);
        hideLoading();
        if (res.error) throw new Error(res.error);
        showTaskResult(selectedTask.task.name, res.result);
      } catch (err) {
        hideLoading();
        alert('Error: ' + err.message);
      }
    }

    function showTaskResult(title, result) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = renderMarkdown(result);
      document.getElementById('taskModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    function copyResult() {
      const text = document.getElementById('modalBody').innerText;
      navigator.clipboard.writeText(text);
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    // --- Loading ---
    function showLoading(text = 'Working...') {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    // --- Context Files ---
    function toggleContextFile(id) {
      if (!id) return;
      const numId = Number(id);
      if (!chatContextFiles.includes(numId)) {
        chatContextFiles.push(numId);
        renderContextChips();
      }
      document.getElementById('contextFileSelect').value = '';
    }

    function removeContextFile(id) {
      chatContextFiles = chatContextFiles.filter(f => f !== id);
      renderContextChips();
    }

    function renderContextChips() {
      const container = document.getElementById('contextChips');
      if (!container) return;
      container.innerHTML = chatContextFiles.map(id => {
        const file = knowledgeFiles.find(f => f.id === id);
        if (!file) return '';
        return `<span class="context-chip">📎 ${file.name} <span class="remove" onclick="removeContextFile(${id})">✕</span></span>`;
      }).join('');
    }

    // --- Knowledge Base View ---
    function renderKnowledgeView() {
      const content = `
        <div class="kb-view">
          <div class="dashboard-header">
            <h2>Knowledge Base</h2>
            <p>Upload reference documents that advisors can use as context during chats and tasks.</p>
          </div>
          <div class="kb-upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <div style="font-size: 14px; font-weight: 600;">Click to upload or drag & drop</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Text files, .md, .txt, .json — max 2MB</div>
            <input type="file" id="fileInput" style="display:none" accept=".txt,.md,.json,.csv,.log" onchange="handleFileUpload(this.files[0])">
          </div>
          <div style="margin-bottom: 16px;">
            <details>
              <summary style="cursor:pointer; font-size:13px; color:var(--text-muted); font-weight:600;">Or paste text directly</summary>
              <div style="margin-top:12px;">
                <input type="text" id="pasteName" placeholder="File name..." style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;margin-bottom:8px;">
                <textarea id="pasteContent" placeholder="Paste content here..." style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;min-height:120px;resize:vertical;"></textarea>
                <button class="run-btn" style="margin-top:8px;" onclick="handlePasteUpload()">Upload Text</button>
              </div>
            </details>
          </div>
          <h3 style="font-size:16px; font-weight:700; margin-bottom:12px;">📁 Files (${knowledgeFiles.length})</h3>
          <div class="kb-file-list" id="kbFileList">
            ${knowledgeFiles.length === 0 ? '<p style="color:var(--text-muted);font-size:14px;">No files yet. Upload one to get started.</p>' : knowledgeFiles.map(f => `
              <div class="kb-file-item">
                <div class="kb-file-icon">📄</div>
                <div class="kb-file-info">
                  <div class="kb-file-name">${f.name}</div>
                  <div class="kb-file-meta">${(f.size/1024).toFixed(1)} KB • ${f.uploadedAt ? new Date(f.uploadedAt).toLocaleDateString() : 'Unknown'}</div>
                </div>
                <div class="kb-file-actions">
                  <button onclick="viewFile(${f.id})">View</button>
                  <button class="danger" onclick="deleteKnowledgeFile(${f.id})">Delete</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
      // Setup drag and drop
      const area = document.getElementById('uploadArea');
      if (area) {
        area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
        area.addEventListener('dragleave', () => area.classList.remove('dragover'));
        area.addEventListener('drop', e => {
          e.preventDefault();
          area.classList.remove('dragover');
          if (e.dataTransfer.files[0]) handleFileUpload(e.dataTransfer.files[0]);
        });
      }
    }

    async function handleFileUpload(file) {
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { alert('File too large (max 2MB)'); return; }
      const formData = new FormData();
      formData.append('file', file);
      showLoading('Uploading...');
      try {
        await API.uploadFileForm(formData);
        knowledgeFiles = await API.getKnowledge();
        hideLoading();
        renderKnowledgeView();
      } catch (err) {
        hideLoading();
        alert('Upload failed: ' + err.message);
      }
    }

    async function handlePasteUpload() {
      const name = document.getElementById('pasteName').value.trim();
      const content = document.getElementById('pasteContent').value.trim();
      if (!name || !content) { alert('Provide both name and content'); return; }
      showLoading('Uploading...');
      try {
        await API.uploadFile(name, content);
        knowledgeFiles = await API.getKnowledge();
        hideLoading();
        renderKnowledgeView();
      } catch (err) {
        hideLoading();
        alert('Upload failed: ' + err.message);
      }
    }

    async function deleteKnowledgeFile(id) {
      if (!confirm('Delete this file?')) return;
      try {
        await API.deleteFile(id);
        knowledgeFiles = await API.getKnowledge();
        renderKnowledgeView();
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    async function viewFile(id) {
      try {
        const res = await fetch(`/api/data/${id}`).then(r => r.json());
        showTaskResult(res.name, res.content);
      } catch (err) {
        alert('Failed to load: ' + err.message);
      }
    }

    // --- Workflows View ---
    function renderWorkflowView() {
      const content = `
        <div class="workflow-view">
          <div class="dashboard-header">
            <h2>Workflows</h2>
            <p>Multi-advisor flows where the team collaborates in sequence. Each step builds on prior outputs.</p>
          </div>
          <div class="workflow-grid">
            ${workflows.map(w => `
              <div class="workflow-card" id="wf-card-${w.id}" onclick="selectWorkflow('${w.id}')">
                <div class="workflow-card-header">
                  <div class="workflow-card-icon">${w.icon}</div>
                  <div>
                    <div class="workflow-card-name">${w.name}</div>
                    <div class="workflow-card-steps">${w.stepCount} steps</div>
                  </div>
                </div>
                <div class="workflow-card-desc">${w.description}</div>
              </div>
            `).join('')}
          </div>
          <div id="workflowDetail"></div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    let selectedWorkflow = null;
    function selectWorkflow(id) {
      document.querySelectorAll('.workflow-card').forEach(c => c.classList.remove('selected'));
      document.getElementById(`wf-card-${id}`).classList.add('selected');
      selectedWorkflow = workflows.find(w => w.id === id);
      const agentMap = {};
      advisors.forEach(a => { agentMap[a.id] = a; });
      const detailHtml = `
        <div class="workflow-run-panel">
          <h3 style="font-size:16px; font-weight:700; margin-bottom:8px;">${selectedWorkflow.icon} ${selectedWorkflow.name}</h3>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">${selectedWorkflow.description}</p>
          <div class="workflow-flow">
            ${selectedWorkflow.steps.map(s => {
              const a = agentMap[s.agentId];
              return `
                <div class="flow-step" id="flow-step-${s.id}">
                  <div class="flow-step-icon" id="flow-icon-${s.id}">${a ? a.icon : '?'}</div>
                  <div class="flow-step-content">
                    <div class="flow-step-title">Step ${s.id}: ${s.action.split(' ').slice(0,4).join(' ')}...
                      <span class="agent-tag">${a ? a.name + ' (' + a.shortTitle + ')' : ''}</span>
                    </div>
                    <div class="flow-step-desc">${s.action}</div>
                    <div id="flow-result-${s.id}"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="form-group">
            <label>Describe your situation</label>
            <textarea id="workflowInput" placeholder="e.g. We are a $5M ARR SaaS company expanding to Germany..." style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;min-height:80px;resize:vertical;"></textarea>
          </div>
          <button class="run-btn" id="runWorkflowBtn" onclick="runSelectedWorkflow()">
            ▶ Run Workflow (${selectedWorkflow.stepCount} steps)
          </button>
        </div>
      `;
      document.getElementById('workflowDetail').innerHTML = detailHtml;
    }

    async function runSelectedWorkflow() {
      if (!selectedWorkflow || workflowRunning) return;
      const input = document.getElementById('workflowInput').value.trim();
      if (!input) { alert('Describe your situation first'); return; }
      workflowRunning = true;
      document.getElementById('runWorkflowBtn').disabled = true;
      document.getElementById('runWorkflowBtn').textContent = '⏳ Running...';

      const total = selectedWorkflow.steps.length;
      for (let i = 0; i < total; i++) {
        const step = selectedWorkflow.steps[i];
        document.getElementById(`flow-icon-${step.id}`).classList.add('active');
        showLoading(`Step ${i+1}/${total}: ${step.action.slice(0, 50)}...`);
      }

      try {
        const result = await API.runWorkflow(selectedWorkflow.id, input);
        hideLoading();
        // Mark all steps and show results
        if (result.steps) {
          result.steps.forEach(step => {
            const icon = document.getElementById(`flow-icon-${step.stepId}`);
            if (icon) { icon.classList.remove('active'); icon.classList.add('done'); icon.textContent = '✓'; }
            const resultDiv = document.getElementById(`flow-result-${step.stepId}`);
            if (resultDiv) {
              resultDiv.innerHTML = `<div class="flow-step-result">${renderMarkdown(step.result)}</div>`;
            }
          });
        }
        // Show final result in modal
        if (result.finalOutput) {
          showTaskResult(`${selectedWorkflow.name} — Final Recommendation`, result.finalOutput);
        }
      } catch (err) {
        hideLoading();
        alert('Workflow failed: ' + err.message);
      }

      workflowRunning = false;
      const btn = document.getElementById('runWorkflowBtn');
      if (btn) { btn.disabled = false; btn.textContent = `▶ Run Workflow (${selectedWorkflow.stepCount} steps)`; }
    }

    // --- Reports View ---
    function renderReportView() {
      reportSections = [];
      const content = `
        <div class="report-view">
          <div class="dashboard-header">
            <h2>Reports</h2>
            <p>Compile a multi-advisor report. Each advisor contributes a section; a synthesizer writes the executive summary.</p>
          </div>
          <div class="task-list-panel" style="margin-bottom:16px;">
            <h3>📝 Report Configuration</h3>
            <div class="form-group">
              <label>Report Title</label>
              <input type="text" id="reportTitle" placeholder="e.g. Q4 Market Expansion Analysis">
            </div>
            <div class="form-group">
              <label>Subject / Challenge</label>
              <textarea id="reportSubject" placeholder="Describe the subject being analyzed..." style="min-height:60px;resize:vertical;"></textarea>
            </div>
            <div class="form-group">
              <label>Synthesizer (writes executive summary)</label>
              <select id="reportSynthesizer" style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;">
                ${advisors.map(a => `<option value="${a.id}" ${a.id === 'ceo' ? 'selected' : ''}>${a.icon} ${a.name} (${a.shortTitle})</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="task-list-panel" style="margin-bottom:16px;">
            <h3>👥 Report Sections</h3>
            <div class="report-add-section">
              <select id="sectionAgent">
                ${advisors.map(a => `<option value="${a.id}">${a.icon} ${a.shortTitle}</option>`).join('')}
              </select>
              <input type="text" id="sectionQuestion" placeholder="Question for this advisor...">
              <button onclick="addReportSection()">+ Add</button>
            </div>
            <div id="reportSectionsList"></div>
          </div>
          <button class="run-btn" onclick="runReport()" style="max-width:300px;margin:0 auto;display:flex;">
            📑 Generate Report
          </button>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    function addReportSection() {
      const agentId = document.getElementById('sectionAgent').value;
      const question = document.getElementById('sectionQuestion').value.trim();
      if (!question) { alert('Enter a question for this advisor'); return; }
      const agent = advisors.find(a => a.id === agentId);
      reportSections.push({ agentId, question });
      document.getElementById('sectionQuestion').value = '';
      renderReportSections();
    }

    function removeReportSection(index) {
      reportSections.splice(index, 1);
      renderReportSections();
    }

    function renderReportSections() {
      const html = reportSections.map((s, i) => {
        const agent = advisors.find(a => a.id === s.agentId);
        return `
          <div class="report-section-card">
            <div class="report-section-header">
              <div class="agent-icon" style="background:${agent.color}22">${agent.icon}</div>
              <div>
                <div class="name">${agent.name}</div>
                <div class="title">${agent.shortTitle}</div>
              </div>
              <button class="remove-btn" onclick="removeReportSection(${i})">Remove</button>
            </div>
            <div style="font-size:13px;color:var(--text-muted);">${s.question}</div>
          </div>
        `;
      }).join('');
      document.getElementById('reportSectionsList').innerHTML = html || '<p style="color:var(--text-muted);font-size:13px;">No sections yet. Add advisors and questions above.</p>';
    }

    async function runReport() {
      const title = document.getElementById('reportTitle').value.trim();
      const subject = document.getElementById('reportSubject').value.trim();
      const synthesizerId = document.getElementById('reportSynthesizer').value;
      if (!title || !subject) { alert('Provide a title and subject'); return; }
      if (reportSections.length === 0) { alert('Add at least one report section'); return; }
      showLoading('Generating report — each advisor contributes, then synthesizes...');
      try {
        const report = await API.generateReport(title, subject, reportSections, synthesizerId);
        hideLoading();
        if (report.error) throw new Error(report.error);
        // Build full report markdown
        let md = `# ${report.title}\n\n**Subject:** ${report.subject}\n**Generated:** ${report.generatedAt}\n\n---\n\n`;
        md += report.executiveSummary + '\n\n---\n\n';
        for (const s of report.sections) {
          md += `## ${s.agent.icon} ${s.agent.name} — ${s.agent.title}\n\n> ${s.question}\n\n${s.content}\n\n`;
        }
        showTaskResult(`${title} — Full Report`, md);
      } catch (err) {
        hideLoading();
        alert('Report failed: ' + err.message);
      }
    }
    // --- Mobile ---
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- Start ---
    init();
  </script>
</body>
</html>
