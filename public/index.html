<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-Suite AI Advisors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #14141d;
      --bg-elevated: #1c1c28;
      --bg-hover: #242434;
      --border: #2a2a3a;
      --border-light: #3a3a4a;
      --text: #e4e4ed;
      --text-muted: #8b8b9e;
      --text-dim: #5a5a6e;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-dim: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Layout --- */
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      width: 320px;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-dim);
      color: var(--accent-hover);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .mode-badge.live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .mode-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .nav-section {
      padding: 16px 12px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding: 0 8px 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--accent-dim);
      color: var(--accent-hover);
    }

    .nav-btn .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .advisor-list {
      flex: 1;
      overflow-y: auto;
    }

    .advisor-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .advisor-card:hover {
      background: var(--bg-hover);
    }

    .advisor-card.active {
      background: var(--bg-elevated);
      border-color: var(--border-light);
    }

    .advisor-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .advisor-info {
      flex: 1;
      min-width: 0;
    }

    .advisor-info .name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .advisor-info .title {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* --- Main Content --- */
    .main {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Dashboard View --- */
    .dashboard {
      overflow-y: auto;
      padding: 32px 40px;
    }

    .dashboard-header {
      margin-bottom: 32px;
    }

    .dashboard-header h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .dashboard-header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .stat-card .stat-value {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .advisor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .advisor-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .advisor-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--advisor-color, var(--accent));
      opacity: 0;
      transition: var(--transition);
    }

    .advisor-tile:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .advisor-tile:hover::before {
      opacity: 1;
    }

    .advisor-tile .tile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .advisor-tile .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: var(--bg-elevated);
    }

    .advisor-tile .tile-name {
      font-size: 16px;
      font-weight: 700;
    }

    .advisor-tile .tile-title {
      font-size: 12px;
      color: var(--text-muted);
    }

    .advisor-tile .tile-tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .advisor-tile .tile-expertise {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .expertise-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* --- Chat View --- */
    .chat-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .chat-header .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .chat-header .info h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .chat-header .info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-header .actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .chat-header .action-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-header .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-light);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .message-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.7;
    }

    .message.user .message-content {
      background: var(--accent-dim);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      margin: 12px 0 8px;
      font-weight: 700;
    }

    .message-content h1 { font-size: 18px; }
    .message-content h2 { font-size: 16px; }
    .message-content h3 { font-size: 14px; }

    .message-content ul,
    .message-content ol {
      margin: 8px 0;
      padding-left: 24px;
    }

    .message-content li {
      margin: 4px 0;
    }

    .message-content table {
      border-collapse: collapse;
      margin: 12px 0;
      width: 100%;
    }

    .message-content th,
    .message-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    .message-content th {
      background: var(--bg-elevated);
      font-weight: 600;
    }

    .message-content code {
      background: var(--bg-elevated);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .message-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .message-content strong {
      font-weight: 600;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 800px;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      transition: var(--transition);
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* --- Task View --- */
    .task-view {
      overflow-y: auto;
      padding: 32px 40px;
    }

    .task-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .task-header .back-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: var(--transition);
    }

    .task-header .back-btn:hover {
      background: var(--bg-hover);
    }

    .task-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .task-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .task-grid { grid-template-columns: 1fr; }
    }

    .task-list-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .task-list-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-item {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .task-item:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
    }

    .task-item.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .task-item .task-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task-item .task-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .task-item .task-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .task-item .input-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-elevated);
      color: var(--text-dim);
    }

    .task-form-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .task-form-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .run-btn {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .run-btn:hover {
      background: var(--accent-hover);
    }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* --- Task Result Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 800px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--bg-hover);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
    }

    .modal-body h1,
    .modal-body h2,
    .modal-body h3 {
      margin: 16px 0 8px;
      font-weight: 700;
    }

    .modal-body h1 { font-size: 20px; }
    .modal-body h2 { font-size: 17px; }
    .modal-body h3 { font-size: 15px; }

    .modal-body ul,
    .modal-body ol { padding-left: 24px; margin: 8px 0; }
    .modal-body li { margin: 4px 0; }

    .modal-body table {
      border-collapse: collapse;
      margin: 12px 0;
      width: 100%;
    }

    .modal-body th,
    .modal-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    .modal-body th {
      background: var(--bg-elevated);
      font-weight: 600;
    }

    .modal-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-muted);
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
    }

    .modal-btn:hover { background: var(--bg-hover); }

    .modal-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .modal-btn.primary:hover { background: var(--accent-hover); }

    /* --- Loading --- */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(4px);
      z-index: 150;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* --- Empty State --- */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }

    /* --- Mobile --- */
    .mobile-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        grid-column: 1;
      }
      .mobile-toggle {
        display: flex;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 101;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .dashboard, .task-view { padding: 60px 16px 16px; }
    }
  </style>
</head>
<body>
  <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🏢</div>
          <div class="logo-text">
            <h1>C-Suite Advisors</h1>
            <p>Your AI Executive Team</p>
          </div>
        </div>
        <div class="mode-badge" id="modeBadge">
          <span class="dot"></span>
          <span id="modeText">Checking...</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Menu</div>
        <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">
          <span class="icon">📊</span> Dashboard
        </button>
        <button class="nav-btn" data-view="tasks" onclick="showView('tasks')">
          <span class="icon">📋</span> Tasks
        </button>
      </div>

      <div class="nav-section advisor-list">
        <div class="nav-label">Advisors</div>
        <div id="advisorList"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="mainContent"></main>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Working on it...</div>
  </div>

  <!-- Task Result Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Task Result</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="copyResult()">Copy</button>
        <button class="modal-btn primary" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>

  <script>
    // --- State ---
    let advisors = [];
    let allTasks = [];
    let currentView = 'dashboard';
    let currentAdvisor = null;
    let chatHistory = {};
    let selectedTask = null;

    // --- API ---
    const API = {
      getAgents: () => fetch('/api/agents').then(r => r.json()),
      getTasks: () => fetch('/api/tasks').then(r => r.json()),
      chat: (agentId, message, history) =>
        fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, message, history }),
        }).then(r => r.json()),
      runTask: (agentId, taskId, inputs) =>
        fetch('/api/tasks/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, taskId, inputs }),
        }).then(r => r.json()),
    };

    // --- Init ---
    async function init() {
      try {
        const [agentsRes, tasksRes] = await Promise.all([API.getAgents(), API.getTasks()]);
        advisors = agentsRes;
        allTasks = tasksRes;
        renderAdvisorList();
        renderDashboard();
        checkMode();
      } catch (err) {
        document.getElementById('mainContent').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><h3>Connection Error</h3><p>Could not connect to the server. Make sure it is running.</p></div>';
      }
    }

    async function checkMode() {
      try {
        const res = await fetch('/api/health').then(r => r.json());
        const badge = document.getElementById('modeBadge');
        const text = document.getElementById('modeText');
        if (res.llmConfigured) {
          badge.classList.add('live');
          text.textContent = 'LLM Connected';
        } else {
          text.textContent = 'Demo Mode';
        }
      } catch {
        document.getElementById('modeText').textContent = 'Demo Mode';
      }
    }

    // --- Markdown Renderer ---
    function renderMarkdown(text) {
      if (!text) return '';
      let html = text;
      // Tables
      html = html.replace(/^\|(.+)\|\n\|([-:\s|]+)\|\n((?:\|.+\|\n?)+)/gm, (match, header, sep, body) => {
        const headers = header.split('|').map(h => h.trim()).filter(h => h);
        const rows = body.trim().split('\n').map(row =>
          row.split('|').map(c => c.trim()).filter((c, i, arr) => i < arr.length)
        );
        let table = '<table><thead><tr>';
        headers.forEach(h => { table += `<th>${h}</th>`; });
        table += '</tr></thead><tbody>';
        rows.forEach(row => {
          table += '<tr>';
          row.forEach(cell => { table += `<td>${cell}</td>`; });
          table += '</tr>';
        });
        table += '</tbody></table>';
        return table;
      });
      // Headings
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      // Bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // Italic
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // Code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Blockquote
      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      // Lists
      html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
      html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
      // Paragraphs
      html = html.split('\n\n').map(block => {
        if (block.startsWith('<') ) return block;
        return `<p>${block.replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
      return html;
    }

    // --- Views ---
    function showView(view, advisorId = null) {
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      if (advisorId) {
        currentAdvisor = advisors.find(a => a.id === advisorId);
        renderChat(currentAdvisor);
      } else if (view === 'dashboard') {
        renderDashboard();
      } else if (view === 'tasks') {
        renderTaskView();
      }
      // Close mobile sidebar
      document.getElementById('sidebar').classList.remove('open');
    }

    // --- Dashboard ---
    function renderDashboard() {
      const totalTasks = advisors.reduce((sum, a) => sum + a.taskCount, 0);
      const capabilities = advisors.reduce((sum, a) => sum + a.capabilities.length, 0);
      const content = `
        <div class="dashboard">
          <div class="dashboard-header">
            <h2>Your AI Executive Team</h2>
            <p>Ten C-level advisors ready to chat and run tasks for your business.</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${advisors.length}</div>
              <div class="stat-label">AI Advisors</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${totalTasks}</div>
              <div class="stat-label">Pre-built Tasks</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${capabilities}</div>
              <div class="stat-label">Capabilities</div>
            </div>
          </div>
          <div class="advisor-grid">
            ${advisors.map(a => `
              <div class="advisor-tile" style="--advisor-color: ${a.color}" onclick="showView('chat','${a.id}')">
                <div class="tile-header">
                  <div class="tile-icon" style="background: ${a.color}22">${a.icon}</div>
                  <div>
                    <div class="tile-name">${a.name}</div>
                    <div class="tile-title">${a.title}</div>
                  </div>
                </div>
                <div class="tile-tagline">${a.tagline}</div>
                <div class="tile-expertise">
                  ${a.expertise.slice(0, 3).map(e => `<span class="expertise-tag">${e}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
    }

    // --- Advisor List (Sidebar) ---
    function renderAdvisorList() {
      const html = advisors.map(a => `
        <div class="advisor-card" data-id="${a.id}" onclick="showView('chat','${a.id}')">
          <div class="advisor-avatar" style="background: ${a.color}22">${a.icon}</div>
          <div class="advisor-info">
            <div class="name">${a.name}</div>
            <div class="title">${a.shortTitle}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('advisorList').innerHTML = html;
    }

    // --- Chat ---
    function renderChat(advisor) {
      if (!advisor) return;
      const history = chatHistory[advisor.id] || [];
      const content = `
        <div class="chat-view">
          <div class="chat-header">
            <div class="avatar" style="background: ${advisor.color}22">${advisor.icon}</div>
            <div class="info">
              <h3>${advisor.name}</h3>
              <p>${advisor.title} • ${advisor.tagline}</p>
            </div>
            <div class="actions">
              <button class="action-btn" onclick="showView('tasks')">📋 Tasks</button>
              <button class="action-btn" onclick="clearChat('${advisor.id}')">🗑️ Clear</button>
            </div>
          </div>
          <div class="messages" id="messages">
            ${history.length === 0 ? `
              <div class="empty-state">
                <div class="icon">${advisor.icon}</div>
                <h3>Chat with ${advisor.name}</h3>
                <p>${advisor.tagline}. Ask about ${advisor.expertise.slice(0, 3).join(', ').toLowerCase()}, or any challenge in their domain.</p>
              </div>
            ` : history.map(msg => renderMessage(msg, advisor)).join('')}
          </div>
          <div class="chat-input-area">
            <div class="chat-input-wrapper">
              <textarea class="chat-input" id="chatInput" placeholder="Ask ${advisor.name} anything..." rows="1"
                onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
              <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
      scrollMessages();
    }

    function renderMessage(msg, advisor) {
      const isUser = msg.role === 'user';
      const avatar = isUser ? '👤' : advisor.icon;
      const avatarBg = isUser ? '' : `style="background: ${advisor.color}22"`;
      return `
        <div class="message ${msg.role}">
          <div class="message-avatar" ${avatarBg}>${avatar}</div>
          <div class="message-content">${isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content)}</div>
        </div>
      `;
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message || !currentAdvisor) return;

      // Store message
      if (!chatHistory[currentAdvisor.id]) chatHistory[currentAdvisor.id] = [];
      chatHistory[currentAdvisor.id].push({ role: 'user', content: message });
      const history = [...chatHistory[currentAdvisor.id]];

      // Render user message
      input.value = '';
      input.style.height = 'auto';
      appendMessage({ role: 'user', content: message }, currentAdvisor);

      // Show typing
      const messages = document.getElementById('messages');
      const typing = document.createElement('div');
      typing.className = 'message';
      typing.id = 'typingIndicator';
      typing.innerHTML = `
        <div class="message-avatar" style="background: ${currentAdvisor.color}22">${currentAdvisor.icon}</div>
        <div class="message-content">
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      `;
      messages.appendChild(typing);
      scrollMessages();

      try {
        const res = await API.chat(currentAdvisor.id, message, history.slice(0, -1));
        document.getElementById('typingIndicator')?.remove();
        if (res.error) throw new Error(res.error);
        chatHistory[currentAdvisor.id].push({ role: 'assistant', content: res.response });
        appendMessage({ role: 'assistant', content: res.response }, currentAdvisor);
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        appendMessage({ role: 'assistant', content: `⚠️ Error: ${err.message}` }, currentAdvisor);
      }
    }

    function appendMessage(msg, advisor) {
      const messages = document.getElementById('messages');
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMessage(msg, advisor);
      messages.appendChild(wrapper.firstElementChild);
      scrollMessages();
    }

    function clearChat(advisorId) {
      chatHistory[advisorId] = [];
      if (currentAdvisor && currentAdvisor.id === advisorId) renderChat(currentAdvisor);
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function scrollMessages() {
      const messages = document.getElementById('messages');
      if (messages) messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Task View ---
    function renderTaskView() {
      const content = `
        <div class="task-view">
          <div class="task-header">
            <button class="back-btn" onclick="showView('dashboard')">← Back</button>
            <h2>Run a Task</h2>
          </div>
          <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 14px;">
            Select an advisor and a task, fill in the inputs, and get a structured deliverable.
          </p>
          <div class="task-grid">
            <div class="task-list-panel">
              <h3>📋 Available Tasks</h3>
              <div id="taskList"></div>
            </div>
            <div class="task-form-panel">
              <h3>📝 Task Inputs</h3>
              <div id="taskForm">
                <p style="color: var(--text-muted); font-size: 13px;">Select a task from the left to begin.</p>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = content;
      renderTaskList();
    }

    function renderTaskList() {
      const html = allTasks.map(group => `
        <div style="margin-bottom: 16px;">
          <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px; color: ${group.color};">
            ${group.icon} ${group.agentName} — ${group.agentTitle}
          </div>
          ${group.tasks.map(t => `
            <div class="task-item" data-task-id="${t.id}" data-agent-id="${group.agentId}" onclick="selectTask('${group.agentId}','${t.id}')">
              <div class="task-name">${t.name}</div>
              <div class="task-desc">${t.description}</div>
              <div class="task-inputs">
                ${t.inputs.map(i => `<span class="input-tag">${i}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
      document.getElementById('taskList').innerHTML = html;
    }

    function selectTask(agentId, taskId) {
      document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-task-id="${taskId}"]`).classList.add('selected');

      const agent = advisors.find(a => a.id === agentId);
      const taskGroup = allTasks.find(g => g.agentId === agentId);
      const task = taskGroup.tasks.find(t => t.id === taskId);
      selectedTask = { agentId, taskId, task, agent };

      const formHtml = `
        <div style="margin-bottom: 16px; padding: 12px; border-radius: 8px; background: ${agent.color}11; border: 1px solid ${agent.color}33;">
          <div style="font-size: 13px; font-weight: 700;">${agent.icon} ${agent.name}</div>
          <div style="font-size: 12px; color: var(--text-muted);">${task.name}</div>
        </div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">${task.description}</p>
        ${task.inputs.map(input => `
          <div class="form-group">
            <label>${input}</label>
            <textarea data-input="${input}" placeholder="Enter ${input.toLowerCase()}..."></textarea>
          </div>
        `).join('')}
        <button class="run-btn" onclick="executeTask()">
          ▶ Run Task
        </button>
      `;
      document.getElementById('taskForm').innerHTML = formHtml;
    }

    async function executeTask() {
      if (!selectedTask) return;
      const inputs = {};
      document.querySelectorAll('[data-input]').forEach(el => {
        inputs[el.dataset.input] = el.value;
      });

      showLoading(`${selectedTask.agent.name} is working on "${selectedTask.task.name}"...`);

      try {
        const res = await API.runTask(selectedTask.agentId, selectedTask.taskId, inputs);
        hideLoading();
        if (res.error) throw new Error(res.error);
        showTaskResult(selectedTask.task.name, res.result);
      } catch (err) {
        hideLoading();
        alert('Error: ' + err.message);
      }
    }

    function showTaskResult(title, result) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = renderMarkdown(result);
      document.getElementById('taskModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    function copyResult() {
      const text = document.getElementById('modalBody').innerText;
      navigator.clipboard.writeText(text);
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    // --- Loading ---
    function showLoading(text = 'Working...') {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    // --- Mobile ---
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- Start ---
    init();
  </script>
</body>
</html>
